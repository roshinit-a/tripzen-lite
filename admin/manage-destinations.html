<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Destinations – Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
  <div class="sidebar">
    <div class="brand">Trip<span>Zen</span> ✈️</div>
    <nav>
      <a href="admin-dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a href="manage-users.html"><i class="fas fa-users"></i> Users</a>
      <a href="manage-destinations.html" class="active"><i class="fas fa-map-marker-alt"></i> Destinations</a>
      <a href="manage-hotels.html"><i class="fas fa-hotel"></i> Hotels</a>
      <a href="manage-packages.html"><i class="fas fa-suitcase"></i> Packages</a>
      <a href="manage-bookings.html"><i class="fas fa-calendar-check"></i> Bookings</a>
      <a href="manage-payments.html"><i class="fas fa-credit-card"></i> Payments</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-danger" style="width:100%;justify-content:center" onclick="DB.logout();location.href='../login.html'"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </div>
  <div class="admin-main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px">
      <h1 style="font-size:1.7rem;font-weight:800;color:var(--dark)">🗺️ Manage Destinations</h1>
      <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Add Destination</button>
    </div>
    <div id="alertBox"></div>
    <div class="data-table">
      <div class="tbl-header"><h3>All Destinations</h3>
        <input type="text" class="form-control" id="searchInput" placeholder="Search..." style="max-width:220px" oninput="render()">
      </div>
      <div id="tableBody"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">➕ Add Destination</h2>
    <div id="modalAlert"></div>
    <form onsubmit="save(event)">
      <input type="hidden" id="editId">
      <div class="form-group"><label class="form-label">Name *</label><input type="text" class="form-control" id="fName" required placeholder="E.g. Goa"></div>
      <div class="grid-2">
        <div class="form-group"><label class="form-label">Country</label><input type="text" class="form-control" id="fCountry" value="India"></div>
        <div class="form-group"><label class="form-label">State</label><input type="text" class="form-control" id="fState" placeholder="E.g. Goa"></div>
      </div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="form-control" id="fDesc" rows="3"></textarea></div>
      <div class="form-group"><label class="form-label">Image URL</label><input type="text" class="form-control" id="fImg" placeholder="https://..."></div>
      <div class="form-group"><label class="form-label">Best Time to Visit</label><input type="text" class="form-control" id="fBest" placeholder="E.g. October – March"></div>
      <div style="display:flex;gap:12px;margin-top:8px">
        <button type="submit" class="btn btn-primary" style="flex:1;justify-content:center"><i class="fas fa-save"></i> Save</button>
        <button type="button" class="btn btn-outline" onclick="closeModal()" style="flex:1;justify-content:center">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/db.js"></script>
<script>
  if (!DB.isLoggedIn() || !DB.isAdmin()) location.href = '../login.html';
  function render() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const all = DB.getDests().filter(d => d.name.toLowerCase().includes(q));
    document.getElementById('tableBody').innerHTML = all.length ? `
      <table>
        <thead><tr><th>#</th><th>Name</th><th>State</th><th>Country</th><th>Best Time</th><th>Actions</th></tr></thead>
        <tbody>${all.map(d => `
          <tr>
            <td>#${d.id}</td>
            <td><strong>🏔️ ${d.name}</strong></td>
            <td>${d.state||'—'}</td>
            <td>${d.country}</td>
            <td>${d.bestTime}</td>
            <td>
              <button class="btn btn-sm" style="background:#cce5ff;color:#004085" onclick="edit(${d.id})">✏️ Edit</button>
              <button class="btn btn-danger btn-sm" style="margin-left:5px" onclick="del(${d.id})">🗑️</button>
            </td>
          </tr>
        `).join('')}</tbody>
      </table>
    ` : '<p style="padding:22px;color:var(--gray)">No destinations.</p>';
  }
  function openModal(d=null) {
    document.getElementById('modalTitle').textContent = d ? '✏️ Edit Destination' : '➕ Add Destination';
    document.getElementById('editId').value   = d?.id||'';
    document.getElementById('fName').value    = d?.name||'';
    document.getElementById('fCountry').value = d?.country||'India';
    document.getElementById('fState').value   = d?.state||'';
    document.getElementById('fDesc').value    = d?.description||'';
    document.getElementById('fImg').value     = d?.imageUrl||'';
    document.getElementById('fBest').value    = d?.bestTime||'';
    document.getElementById('modalOverlay').classList.add('show');
  }
  function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }
  function edit(id) { openModal(DB.getDests().find(d=>d.id===id)); }
  function save(e) {
    e.preventDefault();
    const id = document.getElementById('editId').value;
    const data = { name:document.getElementById('fName').value, country:document.getElementById('fCountry').value, state:document.getElementById('fState').value, description:document.getElementById('fDesc').value, imageUrl:document.getElementById('fImg').value, bestTime:document.getElementById('fBest').value };
    if(id) DB.updateDest(parseInt(id), data);
    else   DB.addDest(data);
    showAlert('alertBox','✅ Saved!','success'); closeModal(); render();
  }
  function del(id) {
    if(!confirm('Delete this destination?')) return;
    DB.deleteDest(id); showAlert('alertBox','✅ Deleted.','success'); render();
  }
  render();
</script>
</body>
</html>

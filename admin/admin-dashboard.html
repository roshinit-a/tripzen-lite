<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – TripZen</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="brand">Trip<span>Zen</span> ✈️</div>
    <nav>
      <a href="admin-dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a href="manage-users.html"><i class="fas fa-users"></i> Users</a>
      <a href="manage-destinations.html"><i class="fas fa-map-marker-alt"></i> Destinations</a>
      <a href="manage-hotels.html"><i class="fas fa-hotel"></i> Hotels</a>
      <a href="manage-packages.html"><i class="fas fa-suitcase"></i> Packages</a>
      <a href="manage-bookings.html"><i class="fas fa-calendar-check"></i> Bookings</a>
      <a href="manage-payments.html"><i class="fas fa-credit-card"></i> Payments</a>
    </nav>
    <div class="sidebar-footer">
      <a href="../index.html" style="display:block;margin-bottom:10px"><button class="btn btn-outline" style="width:100%;justify-content:center;color:white;border-color:rgba(255,255,255,.3)">🌐 View Site</button></a>
      <button class="btn btn-danger" style="width:100%;justify-content:center" onclick="DB.logout();location.href='../login.html'"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="admin-main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:26px">
      <h1 style="font-size:1.7rem;font-weight:800;color:var(--dark)">📊 Admin Dashboard</h1>
      <span style="color:var(--gray);font-size:.9rem">Welcome, <strong id="adminName">Admin</strong></span>
    </div>

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid"></div>

    <!-- Recent Bookings -->
    <div class="data-table">
      <div class="tbl-header">
        <h3>📋 Recent Bookings</h3>
        <a href="manage-bookings.html"><button class="btn btn-primary btn-sm">View All →</button></a>
      </div>
      <div id="recentTable"></div>
    </div>
  </div>
</div>

<script src="../js/db.js"></script>
<script>
  if (!DB.isLoggedIn() || !DB.isAdmin()) location.href = '../login.html';

  const user = DB.getSession();
  document.getElementById('adminName').textContent = user?.name || 'Admin';

  // Stats
  const s = DB.getStats();
  const statsData = [
    { icon:'👥', bg:'#cce5ff', label:'Total Users',    val: s.totalUsers },
    { icon:'✈️', bg:'#d4edda', label:'Total Packages', val: s.totalPackages },
    { icon:'📋', bg:'#fff3cd', label:'Total Bookings', val: s.totalBookings },
    { icon:'💰', bg:'#f8d7da', label:'Total Revenue',  val: formatCurrency(s.totalRevenue) },
  ];
  document.getElementById('statsGrid').innerHTML = statsData.map(s => `
    <div class="stat-card">
      <div class="stat-icon" style="background:${s.bg};font-size:1.6rem">${s.icon}</div>
      <div class="stat-body"><h2>${s.val}</h2><p>${s.label}</p></div>
    </div>
  `).join('');

  // Recent bookings
  const bookings = DB.getBookings().slice(-8).reverse();
  document.getElementById('recentTable').innerHTML = bookings.length ? `
    <table>
      <thead><tr><th>#ID</th><th>Package</th><th>Destination</th><th>Date</th><th>Persons</th><th>Amount</th><th>Status</th></tr></thead>
      <tbody>${bookings.map(b => `
        <tr>
          <td><strong>#${b.id}</strong></td>
          <td>${b.packageName}</td>
          <td>${b.destName}</td>
          <td>${formatDate(b.travelDate)}</td>
          <td>${b.persons}</td>
          <td><strong>${formatCurrency(b.totalPrice)}</strong></td>
          <td>${getStatusBadge(b.status)}</td>
        </tr>
      `).join('')}</tbody>
    </table>
  ` : '<p style="padding:22px;color:var(--gray)">No bookings yet.</p>';
</script>
</body>
</html>

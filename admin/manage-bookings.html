<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Bookings – Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="admin-layout">
  <div class="sidebar">
    <div class="brand">Trip<span>Zen</span> ✈️</div>
    <nav>
      <a href="admin-dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a href="manage-users.html"><i class="fas fa-users"></i> Users</a>
      <a href="manage-destinations.html"><i class="fas fa-map-marker-alt"></i> Destinations</a>
      <a href="manage-hotels.html"><i class="fas fa-hotel"></i> Hotels</a>
      <a href="manage-packages.html"><i class="fas fa-suitcase"></i> Packages</a>
      <a href="manage-bookings.html" class="active"><i class="fas fa-calendar-check"></i> Bookings</a>
      <a href="manage-payments.html"><i class="fas fa-credit-card"></i> Payments</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-danger" style="width:100%;justify-content:center" onclick="DB.logout();location.href='../login.html'"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </div>
  <div class="admin-main">
    <h1 style="font-size:1.7rem;font-weight:800;color:var(--dark);margin-bottom:22px">📋 Manage Bookings</h1>
    <div id="alertBox"></div>
    <div class="data-table">
      <div class="tbl-header">
        <h3>All Bookings</h3>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <select class="form-control" id="statusFilter" style="max-width:150px" onchange="render()">
            <option value="">All Status</option>
            <option>PENDING</option><option>CONFIRMED</option><option>CANCELLED</option>
          </select>
          <input type="text" class="form-control" id="searchInput" placeholder="Search..." style="max-width:200px" oninput="render()">
        </div>
      </div>
      <div id="tableBody"></div>
    </div>
  </div>
</div>

<script src="../js/db.js"></script>
<script>
  if (!DB.isLoggedIn() || !DB.isAdmin()) location.href = '../login.html';
  const allUsers = DB.getUsers();
  function userName(uid) { return (allUsers.find(u=>u.id===uid)||{name:'Unknown'}).name; }

  function render() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const st = document.getElementById('statusFilter').value;
    const all = DB.getBookings().filter(b =>
      (!st || b.status === st) &&
      (b.packageName.toLowerCase().includes(q) || userName(b.userId).toLowerCase().includes(q))
    ).reverse();

    document.getElementById('tableBody').innerHTML = all.length ? `
      <table>
        <thead><tr><th>#ID</th><th>User</th><th>Package</th><th>Travel Date</th><th>Persons</th><th>Amount</th><th>Status</th><th>Update Status</th></tr></thead>
        <tbody>${all.map(b => `
          <tr>
            <td><strong>#${b.id}</strong></td>
            <td>${userName(b.userId)}</td>
            <td>${b.packageName}</td>
            <td>${formatDate(b.travelDate)}</td>
            <td>${b.persons}</td>
            <td><strong>${formatCurrency(b.totalPrice)}</strong></td>
            <td>${getStatusBadge(b.status)}</td>
            <td>
              <select onchange="updateStatus(${b.id},this.value)" style="border:1px solid #ddd;border-radius:8px;padding:4px 8px;font-size:.8rem;font-family:Poppins,sans-serif">
                <option ${b.status==='PENDING'?'selected':''}>PENDING</option>
                <option ${b.status==='CONFIRMED'?'selected':''}>CONFIRMED</option>
                <option ${b.status==='CANCELLED'?'selected':''}>CANCELLED</option>
              </select>
            </td>
          </tr>
        `).join('')}</tbody>
      </table>
    ` : '<p style="padding:22px;color:var(--gray)">No bookings found.</p>';
  }

  function updateStatus(id, status) {
    DB.updateBookingStatus(id, status);
    showAlert('alertBox',`✅ Booking #${id} updated to ${status}`,'success');
    render();
  }
  render();
</script>
</body>
</html>

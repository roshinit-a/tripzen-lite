<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – TripZen</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-page">
<div class="auth-card">
  <div style="text-align:center;margin-bottom:28px">
    <a href="index.html" style="font-size:1.9rem;font-weight:800;color:var(--primary)">Trip<span style="color:var(--secondary)">Zen</span> ✈️</a>
  </div>
  <h2>Welcome Back! 👋</h2>
  <p class="subtitle">Login to continue your journey</p>
  <div id="alertBox"></div>
  <form onsubmit="doLogin(event)">
    <div class="form-group">
      <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
      <input type="email" class="form-control" id="email" placeholder="your@email.com" required>
    </div>
    <div class="form-group">
      <label class="form-label"><i class="fas fa-lock"></i> Password</label>
      <div style="position:relative;display:flex;align-items:center">
        <input type="password" class="form-control" id="password" placeholder="Your password" required style="padding-right:45px">
        <button type="button" class="pwd-toggle" onclick="togglePassword('password', this)" title="Show/Hide Password" style="position:absolute;right:12px;background:none;border:none;cursor:pointer;color:var(--gray);font-size:1.05rem;padding:4px;display:flex;align-items:center;justify-content:center">
          <i class="fas fa-eye"></i>
        </button>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-lg" id="loginBtn" style="width:100%;justify-content:center;margin-top:8px">
      <i class="fas fa-sign-in-alt"></i> Login
    </button>
  </form>
  <p style="text-align:center;margin-top:18px;color:var(--gray);font-size:.9rem">
    No account? <a href="register.html" style="color:var(--primary);font-weight:600">Register here</a>
  </p>
  <div style="margin-top:18px;padding:14px;background:#f0f4ff;border-radius:var(--radius);font-size:.83rem">
    <strong>🔑 Test Accounts:</strong><br>
    👑 Admin: <b>admin@tripzen.com</b> / <b>admin123</b><br>
    🧑 User:  <b>user@tripzen.com</b>  / <b>user123</b>
  </div>
</div>
<script src="js/db.js"></script>
<script>
  // Already logged in?
  if (DB.isLoggedIn()) location.href = DB.isAdmin() ? 'admin/admin-dashboard.html' : 'index.html';

  function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }

  function isValidEmailHandle(email) {
    if (!email || !email.includes('@')) return false;
    const parts = email.trim().toLowerCase().split('@');
    if (parts.length !== 2 || !parts[0] || !parts[1]) return false;
    const domain = parts[1];
    const allowedDomains = ['gmail.com', 'tripzen.com', 'yahoo.com', 'outlook.com', 'hotmail.com', 'icloud.com'];
    const validDomainPattern = /^[a-z0-9-]+(\.[a-z0-9-]+)*\.(com|org|net|edu|in|co|io|ac\.in|edu\.in)$/i;
    return allowedDomains.includes(domain) || validDomainPattern.test(domain);
  }

  function doLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!isValidEmailHandle(email)) {
      showAlert('alertBox', '❌ Email must end with a valid handle (e.g., @gmail.com, @tripzen.com, @yahoo.com, @outlook.com)', 'error');
      return;
    }

    const btn = document.getElementById('loginBtn');
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
    btn.disabled = true;
    setTimeout(() => {
      try {
        const user = DB.loginUser(email, password);
        showAlert('alertBox','✅ Login successful! Redirecting...','success');
        setTimeout(() => {
          location.href = user.role === 'ADMIN' ? 'admin/admin-dashboard.html' : 'index.html';
        }, 900);
      } catch(err) {
        showAlert('alertBox','❌ ' + err.message,'error');
        btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
        btn.disabled = false;
      }
    }, 600);
  }
</script>
</body>
</html>
